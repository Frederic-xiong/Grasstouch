name: Build and TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45
    env:
      SCHEME: Grasstouch
      CONFIGURATION: Release
      ARCHIVE_PATH: ${{ github.workspace }}/build/Grasstouch.xcarchive
      EXPORT_PATH: ${{ github.workspace }}/build/export

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: xcodegen generate

      - name: Verify certificate secret is present
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${BUILD_CERTIFICATE_BASE64:-}" ]; then
            echo "::error::BUILD_CERTIFICATE_BASE64 secret is empty."
            exit 1
          fi
          if [ -z "${P12_PASSWORD:-}" ]; then
            echo "::error::P12_PASSWORD secret is empty."
            exit 1
          fi
          # Decode without `echo` (which appends a newline that can corrupt
          # short base64 streams) and using `tr -d` to strip any whitespace
          # that may have been pasted into the secret.
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | tr -d '[:space:]' | base64 -d > /tmp/cert.p12
          SIZE=$(wc -c < /tmp/cert.p12)
          echo "Decoded p12 size: $SIZE bytes"
          if [ "$SIZE" -lt 1000 ]; then
            echo "::error::Decoded p12 is suspiciously small ($SIZE bytes). The secret is probably not a valid base64-encoded .p12."
            exit 1
          fi
          file /tmp/cert.p12
          # Verify the password is correct before letting `security` near it,
          # so we get a clear "wrong password" message instead of the cryptic
          # SecKeychainItemImport error.
          if ! openssl pkcs12 -in /tmp/cert.p12 -passin "pass:${P12_PASSWORD}" -nokeys -noout 2>/tmp/p12.err; then
            echo "::error::p12 verification failed. Likely a wrong P12_PASSWORD or a corrupted secret."
            sed 's/^/openssl: /' /tmp/p12.err
            exit 1
          fi

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}
          keychain: grasstouch-build
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}

      - name: Install provisioning profiles
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          PROVISIONING_PROFILE_VPN_BASE64: ${{ secrets.PROVISIONING_PROFILE_VPN_BASE64 }}
          PROVISIONING_PROFILE_MONITOR_BASE64: ${{ secrets.PROVISIONING_PROFILE_MONITOR_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          install_profile() {
            local b64="$1" name="$2"
            [ -z "$b64" ] && return
            echo "$b64" | base64 --decode > "/tmp/$name.mobileprovision"
            local uuid
            uuid=$(security cms -D -i "/tmp/$name.mobileprovision" | \
              plutil -extract UUID raw -o - -)
            cp "/tmp/$name.mobileprovision" \
              "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
          }
          install_profile "$PROVISIONING_PROFILE_BASE64" Grasstouch
          install_profile "$PROVISIONING_PROFILE_VPN_BASE64" GrasstouchVPN
          install_profile "$PROVISIONING_PROFILE_MONITOR_BASE64" GrasstouchMonitor

      - name: Archive
        run: |
          set -euo pipefail
          xcodebuild \
            -project Grasstouch.xcodeproj \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            archive \
            CODE_SIGN_STYLE=Manual

      - name: Export IPA
        run: |
          set -euo pipefail
          cat > /tmp/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>uploadBitcode</key><false/>
            <key>uploadSymbols</key><true/>
            <key>signingStyle</key><string>manual</string>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath "$EXPORT_PATH"

      - name: Upload to TestFlight
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPLE_API_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          IPA=$(ls "$EXPORT_PATH"/*.ipa | head -n1)
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$APPLE_API_KEY_ID" \
            --apiIssuer "$APPLE_API_ISSUER_ID"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grasstouch-ipa
          path: ${{ env.EXPORT_PATH }}/*.ipa
          if-no-files-found: ignore
