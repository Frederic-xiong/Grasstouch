name: Grasstouch
options:
  bundleIdPrefix: app.grasstouch
  deploymentTarget:
    iOS: "15.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # DEVELOPMENT_TEAM is injected via the DEVELOPMENT_TEAM env var at generate time.
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}

targets:

  Grasstouch:
    type: application
    platform: iOS
    sources:
      - path: Grasstouch
    info:
      path: Grasstouch/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.grasstouch.Grasstouch
        CODE_SIGN_ENTITLEMENTS: Grasstouch/Grasstouch.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: GrasstouchVPN
        embed: true
        codeSign: true
      - target: GrasstouchMonitor
        embed: true
        codeSign: true
    entitlements:
      path: Grasstouch/Grasstouch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.grasstouch.shared
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        com.apple.developer.family-controls: true

  GrasstouchVPN:
    type: app-extension
    platform: iOS
    sources:
      - path: GrasstouchVPN
      # Share these files with the extension so it can read App Group state
      # without a Swift package boundary.
      - path: Grasstouch/Models/SharedConfig.swift
      - path: Grasstouch/Services/DarwinNotification.swift
    info:
      path: GrasstouchVPN/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.grasstouch.Grasstouch.GrasstouchVPN
        CODE_SIGN_ENTITLEMENTS: GrasstouchVPN/GrasstouchVPN.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    entitlements:
      path: GrasstouchVPN/GrasstouchVPN.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.grasstouch.shared
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider

  GrasstouchMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: GrasstouchMonitor
      - path: Grasstouch/Models/SharedConfig.swift
      - path: Grasstouch/Services/DarwinNotification.swift
    info:
      path: GrasstouchMonitor/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.grasstouch.Grasstouch.GrasstouchMonitor
        CODE_SIGN_ENTITLEMENTS: GrasstouchMonitor/GrasstouchMonitor.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    entitlements:
      path: GrasstouchMonitor/GrasstouchMonitor.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.grasstouch.shared
        com.apple.developer.family-controls: true

schemes:
  Grasstouch:
    build:
      targets:
        Grasstouch: all
        GrasstouchVPN: all
        GrasstouchMonitor: all
    run:
      config: Debug
    archive:
      config: Release
    profile:
      config: Release
    analyze:
      config: Debug
